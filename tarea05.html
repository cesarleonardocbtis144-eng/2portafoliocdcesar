<!DOCTYPE html>
<html>
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>figuras geometricas con HTML</title>

	<style>
		body
		{
			background: #F54927;
			color: #572217;
			text-align: center;
		}	

		div
		{
			background: #0A0505;
			margin: 0 0 10px 10px;
			display: inline-block;
		}

		.cuadrado
		{
			width: 200px;
			height: 200px;
		}

		.circulo
		{
			width: 200px;
			height: 200px;
			border-radius: 50%;
		}

		.rectangulo
		{
			width: 400px;
			height: 200px;
		}

		.descripcion
		{
			background: #612466;
			width: 80%;
			
			border-radius: 20px;
			border: 2px white solid;
			color: black;
		}

	</style>

</head>

	<div class="cuadrado">
	
	</div>

	</div>
